# Builds the Flow Notes desktop app for macOS, Windows and Linux and publishes
# the installers to a GitHub Release with fixed file names, so the website's
# download links (src/lib/downloads.ts) always point at the newest version:
#   https://github.com/lucashooper/flow/releases/latest/download/<file>
#
# Run it from the Actions tab ("Desktop release" → Run workflow), or push a tag
# like `desktop-v0.2.0`. Bump "version" in src-tauri/tauri.conf.json first.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — enable "Sign in to Flow Cloud"
#   in the desktop app. Without them the app works with local vaults only.
#   APPLE_CERTIFICATE (base64 Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), plus
#   APPLE_API_KEY_ID / APPLE_API_ISSUER / APPLE_API_KEY_P8 — sign and notarize the
#   Mac app so macOS opens it without a security warning.
#   TAURI_SIGNING_PRIVATE_KEY — signs updates so installed apps can update
#   themselves (the public key is in src-tauri/tauri.conf.json). Without it,
#   installers are still built but no update is published.
name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ''
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            rust_targets: ''
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      HAS_MAC_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Set up Mac signing + notarization (when the secrets exist)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "MAC_SIGNED=1" >> "$GITHUB_ENV"

      - name: Build app
        shell: bash
        run: |
          if [ -n "$MAC_SIGNED" ] && [ -n "$MAC_CERT" ]; then
            export APPLE_CERTIFICATE="$MAC_CERT" APPLE_CERTIFICATE_PASSWORD="$MAC_CERT_PASSWORD" APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY"
            if [ -n "$MAC_API_ISSUER" ] && [ -n "$MAC_API_KEY_ID" ]; then
              export APPLE_API_ISSUER="$MAC_API_ISSUER" APPLE_API_KEY="$MAC_API_KEY_ID"
            fi
          else
            MAC_SIGNED=""
          fi
          # Extra config: skip updater files without the signing key; on Mac,
          # sign with the Developer ID instead of ad-hoc when it's available.
          EXTRA=$(node -e "
            const c = {};
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY) c.bundle = { createUpdaterArtifacts: false };
            if (process.env.MAC_SIGNED) (c.bundle ??= {}).macOS = { signingIdentity: process.env.APPLE_SIGNING_IDENTITY };
            process.stdout.write(JSON.stringify(c));
          ")
          [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without auto-update files"
          [ "${{ runner.os }}" = "macOS" ] && [ -z "$MAC_SIGNED" ] && echo "::warning::Mac app is not Developer ID signed (add APPLE_CERTIFICATE etc.): macOS will block it until opened via Privacy & Security"
          echo "Extra config: $EXTRA"
          if ! npx tauri build ${{ matrix.args }} --config "$EXTRA"; then
            if [ -n "${APPLE_CERTIFICATE:-}" ]; then
              # Don't let a signing problem block the whole release: build unsigned and warn.
              echo "::error::Developer ID signing failed (check APPLE_CERTIFICATE is a base64 .p12 WITH its private key, and APPLE_CERTIFICATE_PASSWORD matches). Publishing an unsigned Mac build instead."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
              EXTRA=$(node -e "const c={}; if (!process.env.TAURI_SIGNING_PRIVATE_KEY) c.bundle={createUpdaterArtifacts:false}; process.stdout.write(JSON.stringify(c))")
              npx tauri build ${{ matrix.args }} --config "$EXTRA"
            else
              exit 1
            fi
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          # Mac only: Developer ID certificate (base64 .p12) + notarization via the App Store Connect API key.
          # Passed under other names and exported only when set: Tauri tries to sign as soon as
          # APPLE_CERTIFICATE exists, even when it's empty.
          MAC_CERT: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          MAC_CERT_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          MAC_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          MAC_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          MAC_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}

      - name: Collect installers with stable names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          # File names contain spaces ("Flow Notes_0.4.0_…"), so quote everything.
          copy_sig() { if [ -f "$1.sig" ]; then cp "$1.sig" "$2.sig"; fi; }
          case "${{ runner.os }}" in
            macOS)
              B=src-tauri/target/universal-apple-darwin/release/bundle
              cp $B/dmg/*.dmg out/Flow-Notes-macOS.dmg
              for f in $B/macos/*.app.tar.gz; do cp "$f" out/Flow-Notes-macOS.app.tar.gz; copy_sig "$f" out/Flow-Notes-macOS.app.tar.gz; done ;;
            Windows)
              B=src-tauri/target/release/bundle
              for f in $B/nsis/*-setup.exe; do cp "$f" out/Flow-Notes-Windows-Setup.exe; copy_sig "$f" out/Flow-Notes-Windows-Setup.exe; done ;;
            Linux)
              B=src-tauri/target/release/bundle
              for f in $B/appimage/*.AppImage; do cp "$f" out/Flow-Notes-Linux.AppImage; copy_sig "$f" out/Flow-Notes-Linux.AppImage; done
              cp $B/deb/*.deb out/Flow-Notes-Linux.deb ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; else TAG="desktop-v${VERSION}"; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Write update feed (latest.json)
        run: |
          node - <<'JS'
          const fs = require('fs');
          const tag = process.env.TAG;
          const base = `https://github.com/${process.env.REPO}/releases/download/${tag}`;
          const entry = (file) => {
            const sig = `out/${file}.sig`;
            return fs.existsSync(sig) ? { signature: fs.readFileSync(sig, 'utf8').trim(), url: `${base}/${file}` } : null;
          };
          const platforms = {};
          const add = (keys, file) => { const e = entry(file); if (e) keys.forEach((k) => (platforms[k] = e)); };
          add(['windows-x86_64'], 'Flow-Notes-Windows-Setup.exe');
          add(['darwin-aarch64', 'darwin-x86_64'], 'Flow-Notes-macOS.app.tar.gz');
          add(['linux-x86_64'], 'Flow-Notes-Linux.AppImage');
          if (!Object.keys(platforms).length) { console.log('No signatures: skipping latest.json'); process.exit(0); }
          fs.writeFileSync('out/latest.json', JSON.stringify({
            version: process.env.VERSION, notes: `Flow Notes ${process.env.VERSION}`, pub_date: new Date().toISOString(), platforms,
          }, null, 2));
          console.log('latest.json for', Object.keys(platforms).join(', '));
          JS
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flow Notes ${{ steps.version.outputs.version }} for desktop
          make_latest: true
          files: out/*
          body: |
            Flow Notes for desktop. Keep your notes in Flow Cloud, or as files in a local vault on your computer.

            | Platform | Download |
            | --- | --- |
            | macOS (Apple Silicon & Intel) | [Flow-Notes-macOS.dmg](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Flow-Notes-macOS.dmg) |
            | Windows 10 / 11 | [Flow-Notes-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Flow-Notes-Windows-Setup.exe) |
            | Linux | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Flow-Notes-Linux.AppImage) · [.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Flow-Notes-Linux.deb) |

            **First launch:** the app isn't signed with a paid Apple / Microsoft certificate yet.
            On Mac, right-click the app → Open (or System Settings → Privacy & Security → Open Anyway).
            On Windows, click "More info" → "Run anyway" if SmartScreen appears.
