<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Data Export Tool</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #0f0f0f;
      color: #e0e0e0;
    }
    h1 { color: #38bdf8; }
    button {
      background: #38bdf8;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 10px 10px 10px 0;
    }
    button:hover { background: #0ea5e9; }
    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    pre {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
    }
    .success { background: #10b98133; border: 1px solid #10b981; }
    .error { background: #ef444433; border: 1px solid #ef4444; }
    .info { background: #3b82f633; border: 1px solid #3b82f6; }
    .warning { background: #f59e0b33; border: 1px solid #f59e0b; }
  </style>
</head>
<body>
  <h1>🚨 Flow Data Emergency Export</h1>
  <p>This tool extracts all your notes and folders from IndexedDB and generates SQL to restore them to Supabase.</p>
  
  <button id="exportBtn" onclick="exportData()">Export Data</button>
  <button id="generateSqlBtn" onclick="generateSql()" disabled>Generate SQL for Supabase</button>
  <button id="downloadJsonBtn" onclick="downloadJson()" disabled>Download JSON Backup</button>
  
  <div id="status"></div>
  <div id="output"></div>

  <script>
    let exportedData = null;

    async function exportData() {
      const statusDiv = document.getElementById('status');
      const outputDiv = document.getElementById('output');
      statusDiv.innerHTML = '<div class="info">🔄 Exporting data from IndexedDB...</div>';
      outputDiv.innerHTML = '';

      try {
        const db = await new Promise((resolve, reject) => {
          const request = indexedDB.open('FlowDB');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });

        const transaction = db.transaction(['notes', 'folders', 'outbox'], 'readonly');
        
        const notes = await new Promise((resolve) => {
          const request = transaction.objectStore('notes').getAll();
          request.onsuccess = () => resolve(request.result);
        });
        
        const folders = await new Promise((resolve) => {
          const request = transaction.objectStore('folders').getAll();
          request.onsuccess = () => resolve(request.result);
        });

        const outbox = await new Promise((resolve) => {
          const request = transaction.objectStore('outbox').getAll();
          request.onsuccess = () => resolve(request.result);
        });

        exportedData = { notes, folders, outbox, exported_at: new Date().toISOString() };

        let summary = `<div class="success">✅ Export complete!\n\n`;
        summary += `📊 Summary:\n`;
        summary += `- ${notes.length} notes\n`;
        summary += `- ${folders.length} folders\n`;
        summary += `- ${outbox.length} items in sync queue\n\n`;

        // Find David meeting folder
        const davidFolder = folders.find(f => 
          f.name?.toLowerCase().includes('david') && 
          (f.name?.toLowerCase().includes('meeting') || f.name?.toLowerCase().includes('meet'))
        );
        if (davidFolder) {
          summary += `\n📁 Found folder: "${davidFolder.name}" (ID: ${davidFolder.id})\n`;
          const davidNotes = notes.filter(n => n.folder_id === davidFolder.id);
          summary += `  → Contains ${davidNotes.length} notes:\n`;
          davidNotes.forEach(n => {
            summary += `    • ${n.title || '(untitled)'}\n`;
          });
        }

        // Find Lava note
        const lavaNote = notes.find(n => 
          n.title?.toLowerCase().includes('lava') || 
          n.title?.toLowerCase().includes('opportunity')
        );
        if (lavaNote) {
          summary += `\n🌋 Found note: "${lavaNote.title}"\n`;
          summary += `   ID: ${lavaNote.id}\n`;
          summary += `   Folder: ${lavaNote.folder_id || 'none'}\n`;
          summary += `   Content length: ${lavaNote.content?.length || 0} chars\n`;
        }

        summary += `</div>`;
        statusDiv.innerHTML = summary;

        // Show full data
        outputDiv.innerHTML = '<h3>Full Export Data:</h3><pre>' + 
          JSON.stringify(exportedData, null, 2) + '</pre>';

        document.getElementById('generateSqlBtn').disabled = false;
        document.getElementById('downloadJsonBtn').disabled = false;

      } catch (error) {
        statusDiv.innerHTML = `<div class="error">❌ Export failed: ${error.message}</div>`;
      }
    }

    function escapeSQL(str) {
      if (str === null || str === undefined) return 'NULL';
      if (typeof str !== 'string') return `'${String(str).replace(/'/g, "''")}'`;
      return `'${str.replace(/'/g, "''")}'`;
    }

    function generateSql() {
      if (!exportedData) return;

      const outputDiv = document.getElementById('output');
      const { folders, notes } = exportedData;

      let sql = `-- Flow Data Recovery SQL\n`;
      sql += `-- Generated: ${new Date().toISOString()}\n\n`;

      sql += `-- First, ensure columns exist\n`;
      sql += `ALTER TABLE folders ADD COLUMN IF NOT EXISTS icon_url TEXT;\n`;
      sql += `ALTER TABLE folders ADD COLUMN IF NOT EXISTS is_starred BOOLEAN DEFAULT false;\n`;
      sql += `ALTER TABLE folders ADD COLUMN IF NOT EXISTS position INTEGER;\n`;
      sql += `ALTER TABLE notes ADD COLUMN IF NOT EXISTS position INTEGER;\n\n`;

      sql += `-- Fix RLS policies\n`;
      sql += `DROP POLICY IF EXISTS "Users can do everything with own folders" ON folders;\n`;
      sql += `CREATE POLICY "Users can do everything with own folders"\n`;
      sql += `  ON folders FOR ALL\n`;
      sql += `  USING (auth.uid() = user_id)\n`;
      sql += `  WITH CHECK (auth.uid() = user_id);\n\n`;

      sql += `DROP POLICY IF EXISTS "Users can do everything with own notes" ON notes;\n`;
      sql += `CREATE POLICY "Users can do everything with own notes"\n`;
      sql += `  ON notes FOR ALL\n`;
      sql += `  USING (auth.uid() = user_id)\n`;
      sql += `  WITH CHECK (auth.uid() = user_id);\n\n`;

      // Insert folders first (dependency for notes)
      sql += `-- Insert folders\n`;
      folders.forEach(folder => {
        sql += `INSERT INTO folders (id, name, emoji, icon_url, is_starred, user_id, parent_id, dashboard_id, created_at, updated_at, position)\n`;
        sql += `VALUES (\n`;
        sql += `  ${escapeSQL(folder.id)},\n`;
        sql += `  ${escapeSQL(folder.name)},\n`;
        sql += `  ${escapeSQL(folder.emoji)},\n`;
        sql += `  ${escapeSQL(folder.icon_url)},\n`;
        sql += `  ${folder.is_starred || false},\n`;
        sql += `  ${escapeSQL(folder.user_id)},\n`;
        sql += `  ${escapeSQL(folder.parent_id)},\n`;
        sql += `  ${escapeSQL(folder.dashboard_id)},\n`;
        sql += `  ${escapeSQL(folder.created_at)},\n`;
        sql += `  ${escapeSQL(folder.updated_at)},\n`;
        sql += `  ${folder.position || 0}\n`;
        sql += `) ON CONFLICT (id) DO UPDATE SET\n`;
        sql += `  name = EXCLUDED.name,\n`;
        sql += `  emoji = EXCLUDED.emoji,\n`;
        sql += `  icon_url = EXCLUDED.icon_url,\n`;
        sql += `  is_starred = EXCLUDED.is_starred,\n`;
        sql += `  updated_at = EXCLUDED.updated_at;\n\n`;
      });

      // Insert notes
      sql += `-- Insert notes\n`;
      notes.forEach(note => {
        sql += `INSERT INTO notes (id, title, content, user_id, folder_id, dashboard_id, created_at, updated_at, emoji, drawing_data, is_starred, position)\n`;
        sql += `VALUES (\n`;
        sql += `  ${escapeSQL(note.id)},\n`;
        sql += `  ${escapeSQL(note.title)},\n`;
        sql += `  ${escapeSQL(note.content)},\n`;
        sql += `  ${escapeSQL(note.user_id)},\n`;
        sql += `  ${escapeSQL(note.folder_id)},\n`;
        sql += `  ${escapeSQL(note.dashboard_id)},\n`;
        sql += `  ${escapeSQL(note.created_at)},\n`;
        sql += `  ${escapeSQL(note.updated_at)},\n`;
        sql += `  ${escapeSQL(note.emoji)},\n`;
        sql += `  ${note.drawing_data ? escapeSQL(JSON.stringify(note.drawing_data)) : 'NULL'},\n`;
        sql += `  ${note.is_starred || false},\n`;
        sql += `  ${note.position || 0}\n`;
        sql += `) ON CONFLICT (id) DO UPDATE SET\n`;
        sql += `  title = EXCLUDED.title,\n`;
        sql += `  content = EXCLUDED.content,\n`;
        sql += `  folder_id = EXCLUDED.folder_id,\n`;
        sql += `  emoji = EXCLUDED.emoji,\n`;
        sql += `  drawing_data = EXCLUDED.drawing_data,\n`;
        sql += `  is_starred = EXCLUDED.is_starred,\n`;
        sql += `  updated_at = EXCLUDED.updated_at;\n\n`;
      });

      sql += `-- Done! Your data has been restored.\n`;

      outputDiv.innerHTML = `<h3>SQL for Supabase SQL Editor:</h3>` +
        `<div class="info">Copy this SQL and run it in Supabase Dashboard → SQL Editor</div>` +
        `<pre>${sql}</pre>`;

      // Auto-download SQL file
      const blob = new Blob([sql], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `flow-restore-${Date.now()}.sql`;
      a.click();
      URL.revokeObjectURL(url);

      document.getElementById('status').innerHTML = 
        '<div class="success">✅ SQL generated and downloaded! Run it in Supabase SQL Editor.</div>';
    }

    function downloadJson() {
      if (!exportedData) return;

      const blob = new Blob([JSON.stringify(exportedData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `flow-backup-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);

      document.getElementById('status').innerHTML = 
        '<div class="success">✅ JSON backup downloaded!</div>';
    }
  </script>
</body>
</html>
